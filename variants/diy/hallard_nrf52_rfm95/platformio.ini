[env:hallard_nrf52_rfm95]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/diy/hallard_nrf52_rfm95
  -D PRIVATE_HW
  -L "${platformio.libdeps_dir}/${this.__env__}/bsec2/src/cortex-m4/fpv4-sp-d16-hard"
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/hallard_nrf52_rfm95>
lib_deps = 
  ${nrf52840_base.lib_deps}
debug_tool = jlink
